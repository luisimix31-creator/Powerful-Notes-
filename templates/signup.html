<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - Powerful Notes</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="theme-color" content="#6c5ce7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Powerful Notes">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="panel auth-panel">
    <h1 class="logo"><span class="piece">🧩</span> Powerful Notes</h1>
    <h2>Create Your Account</h2>
    {% if error %}<div class="hint auth-error">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Practice / Your Name <input type="text" name="practice_name" placeholder="e.g. Luis Ramirez, BCBA"></label>
      <label>Email <input type="email" name="email" required autofocus></label>
      <label>Password (8+ characters) <input type="password" name="password" minlength="8" required></label>
      <div class="row generate-row">
        <button type="submit" class="btn">Sign Up</button>
      </div>
    </form>
    <div class="hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
  </div>
</div>
</body>
</html>
