<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Powerful Notes</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="theme-color" content="#6c5ce7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Powerful Notes">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="panel auth-panel">
    <h1 class="logo"><span class="piece">🧩</span> Powerful Notes</h1>
    <h2>Set a New Password</h2>
    {% if invalid %}
      <div class="hint auth-error">This reset link is invalid or has expired.</div>
      <div class="hint"><a href="{{ url_for('forgot_password') }}">Request a new reset link</a></div>
    {% else %}
      {% if error %}<div class="hint auth-error">{{ error }}</div>{% endif %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>New Password <input type="password" name="password" required autofocus></label>
        <label>Confirm New Password <input type="password" name="confirm_password" required></label>
        <div class="row generate-row">
          <button type="submit" class="btn">Reset Password</button>
        </div>
      </form>
    {% endif %}
    <div class="hint"><a href="{{ url_for('login') }}">Back to log in</a></div>
  </div>
</div>
</body>
</html>
