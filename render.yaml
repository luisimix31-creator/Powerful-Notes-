databases:
  - name: powerful-notes-db
    plan: free

services:
  - type: web
    name: powerful-notes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: powerful-notes-db
          property: connectionString
