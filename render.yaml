databases:
  - name: powerful-notes-db
    plan: free

services:
  - type: web
    name: powerful-notes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: powerful-notes-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: SUPPORT_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_2
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_3
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_4
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
